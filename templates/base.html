<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}BS Store{% endblock %} — склад и касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var saved = localStorage.getItem("mini-erp-tema");
    var tema = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", tema);
  } catch (e) {}
})();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --surface: #ffffff;
    --border: #e6e5e1;
    --border-soft: #f0efec;
    --text: #23231f;
    --text-muted: #7a7972;
    --accent: #2f6f4f;
    --accent-hover: #24593f;
    --accent-soft: #e9f3ee;
    --danger: #c23a2e;
    --danger-soft: #fbebe9;
    --success: #1d7a3e;
    --info: #3b4fc7;
    --info-soft: #eef1fb;
    --warn: #a86a10;
    --warn-soft: #fbf1df;
    --violet: #7c3bc7;
    --violet-soft: #f2ecfb;
    --row-hover: #fafaf9;
    --radius: 16px;
    --shadow: 0 2px 6px rgba(20, 20, 15, 0.05), 0 10px 30px rgba(20, 20, 15, 0.06);
    --surface-glass: rgba(255, 255, 255, 0.78);
    --glow-1: rgba(47, 111, 79, 0.06);
    --glow-2: rgba(59, 79, 199, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #16171a;
      --surface: #1f2023;
      --border: #35363b;
      --border-soft: #2a2b2f;
      --text: #eae9e6;
      --text-muted: #9b9a94;
      --accent: #46a578;
      --accent-hover: #57b88a;
      --accent-soft: rgba(70, 165, 120, 0.16);
      --danger: #e2695c;
      --danger-soft: rgba(226, 105, 92, 0.16);
      --success: #4fbf85;
      --info: #8fa0ff;
      --info-soft: rgba(143, 160, 255, 0.14);
      --warn: #e0a53f;
      --warn-soft: rgba(224, 165, 63, 0.16);
      --violet: #b98fff;
      --violet-soft: rgba(185, 143, 255, 0.16);
      --row-hover: rgba(255, 255, 255, 0.035);
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 14px 36px rgba(0, 0, 0, 0.4);
      --surface-glass: rgba(31, 32, 35, 0.72);
      --glow-1: rgba(70, 165, 120, 0.20);
      --glow-2: rgba(143, 160, 255, 0.16);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16171a;
    --surface: #1f2023;
    --border: #35363b;
    --border-soft: #2a2b2f;
    --text: #eae9e6;
    --text-muted: #9b9a94;
    --accent: #46a578;
    --accent-hover: #57b88a;
    --accent-soft: rgba(70, 165, 120, 0.16);
    --danger: #e2695c;
    --danger-soft: rgba(226, 105, 92, 0.16);
    --success: #4fbf85;
    --info: #8fa0ff;
    --info-soft: rgba(143, 160, 255, 0.14);
    --warn: #e0a53f;
    --warn-soft: rgba(224, 165, 63, 0.16);
    --violet: #b98fff;
    --violet-soft: rgba(185, 143, 255, 0.16);
    --row-hover: rgba(255, 255, 255, 0.035);
    --shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 14px 36px rgba(0, 0, 0, 0.4);
    --surface-glass: rgba(31, 32, 35, 0.72);
    --glow-1: rgba(70, 165, 120, 0.20);
    --glow-2: rgba(143, 160, 255, 0.16);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(650px circle at 12% -8%, var(--glow-1), transparent 60%),
      radial-gradient(550px circle at 92% 4%, var(--glow-2), transparent 55%);
    background-repeat: no-repeat;
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.15s, color 0.15s;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 24px 0;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2px;
  }
  .brand-logo { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; }
  .brand-row h1 {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0;
    letter-spacing: 0.1px;
  }
  .brand-row h1 b { color: var(--accent); font-weight: 700; }
  .subtitle { color: var(--text-muted); margin-bottom: 14px; font-size: 13px; }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0;
    width: 32px;
    height: 32px;
    margin-bottom: 8px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
    transition: color 0.15s, background 0.15s;
  }
  .theme-toggle svg { width: 16px; height: 16px; }
  .theme-toggle:hover { color: var(--text); background: var(--bg); }
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  .nav a {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: 8px 8px 0 0;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, background 0.15s;
  }
  .nav a svg { width: 16px; height: 16px; flex: none; }
  .nav a:hover { color: var(--text); background: var(--bg); }
  .nav a.active {
    color: var(--accent);
    background: var(--accent-soft);
    border-bottom-color: var(--accent);
    border-radius: 8px 8px 0 0;
  }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
    transition: max-width 0.15s;
  }
  .page.page-wide { max-width: 1700px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .card h2 {
    font-size: 14.5px;
    font-weight: 600;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 svg { width: 16px; height: 16px; color: var(--text-muted); }

  .balans-wrap {
    background: linear-gradient(135deg, var(--accent-soft), transparent);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .balans-wrap.manfiy { background: linear-gradient(135deg, var(--danger-soft), transparent); }
  .balans-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .balans { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
  .balans.manfiy { color: var(--danger); }
  .balans.musbat { color: var(--success); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--border-soft); }
  th { color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  td.empty-row { text-align: center; color: var(--text-muted); padding: 22px 6px; }

  form, .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11.5px; color: var(--text-muted); font-weight: 500; }
  .field-grow { flex: 1; min-width: 140px; }

  input, select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type=text], input[type=number] { width: 100%; }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 550;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16); }
  button:active { transform: translateY(0); filter: brightness(0.98); }

  .variant-list { display: flex; flex-direction: column; gap: 6px; }
  .variant-row { display: flex; gap: 6px; align-items: center; }
  .variant-row .variant-input { flex: 1; }
  .variant-remove {
    background: none;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 0;
    width: 32px;
    height: 32px;
    line-height: 1;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    flex: none;
  }
  .variant-remove:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-soft); }

  .tovar-row input.tovar-miqdor { flex: none; width: 100px; }

  .tovar-combo { position: relative; flex: 2; min-width: 140px; }
  .tovar-combo .tovar-mahsulot-search { width: 100%; }
  .tovar-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    z-index: 20;
  }
  .tovar-dropdown-item { padding: 8px 10px; font-size: 13.5px; cursor: pointer; }
  .tovar-dropdown-item:hover { background: var(--row-hover); }
  .tovar-dropdown-empty { padding: 8px 10px; font-size: 13px; color: var(--text-muted); }

  #btn-yangi-operatsiya { flex: none; }

  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-btn {
    background: none;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 500;
    border-radius: 999px;
  }
  .filter-btn:hover { background: var(--bg); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: -8px;
    margin-bottom: 14px;
  }
  .hint-inline { font-weight: 400; color: var(--text-muted); }

  .xato {
    color: var(--danger);
    background: var(--danger-soft);
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-top: -6px;
    margin-bottom: 12px;
    display: none;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-kirim { background: var(--accent-soft); color: var(--success); }
  .badge-chiqim { background: var(--warn-soft); color: var(--warn); }
  .badge-samovykup { background: var(--info-soft); color: var(--info); }
  .badge-spisanie { background: var(--danger-soft); color: var(--danger); }
  .badge-prodazha { background: var(--violet-soft); color: var(--violet); }

  .qoldiq-kam { color: var(--danger); font-weight: 650; }
  .full { grid-column: 1 / -1; }

  .clickable-row { cursor: pointer; }
  .mahsulot-cell { display: flex; align-items: center; gap: 10px; }
  .thumb { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); flex: none; }
  .thumb-empty { background: var(--bg); border: 1px dashed var(--border); }
  img.thumb { cursor: zoom-in; }
  .thumb-hover-preview {
    display: none;
    position: fixed;
    width: 240px;
    height: 240px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    z-index: 1000;
    background: var(--surface);
    pointer-events: none;
  }
  .thumb-lg { width: 100%; height: 220px; border-radius: var(--radius); object-fit: cover; border: 1px solid var(--border); display: block; }
  .thumb-lg-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px dashed var(--border);
  }
  .thumb-lg-empty svg { width: 40px; height: 40px; }

  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .back-link:hover { color: var(--text); }
  .back-link svg { width: 15px; height: 15px; }

  .detail-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail-title-row h2 { margin: 0; font-size: 20px; }
  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn:hover { color: var(--text); background: var(--bg); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-soft); }

  .btn-secondary {
    background: none;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg); }

  #mahsulotlar-table input[type=number] { width: 110px; }
  .save-status { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

  .sotish-cell { display: flex; align-items: center; gap: 6px; }
  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
  }
  .copy-btn svg { width: 13px; height: 13px; }
  .copy-btn:hover { color: var(--text); background: var(--bg); }
  .copy-btn.copied { color: var(--success); border-color: var(--success); }

  .mini-stat { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .mini-stat-label { font-size: 12.5px; color: var(--text-muted); }
  .mini-stat-value { font-size: 15px; font-weight: 650; color: var(--accent); }

  .stat-box {
    background: linear-gradient(135deg, var(--accent-soft), transparent);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 4px;
  }
  .stat-box .balans-label { margin-bottom: 2px; }
  .stat-box .balans { font-size: 24px; }
  .stat-box.manfiy { background: linear-gradient(135deg, var(--danger-soft), transparent); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <img src="/static/bs-logo.jpg" alt="BS Store" class="brand-logo">
        <h1>BS <b>Store</b></h1>
      </div>
      <div class="subtitle">Склад и касса — все записи вносятся вручную</div>
      <div class="nav-row">
        <nav class="nav">
          <a href="/" class="{% if active == 'mahsulotlar' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
            Товары
          </a>
          <a href="/ombor" class="{% if active == 'ombor' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16l-4-4 4-4"/><path d="M3 12h13"/><path d="M17 8l4 4-4 4"/><path d="M21 12H8"/></svg>
            Складские операции
          </a>
          <a href="/kassa" class="{% if active == 'kassa' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="14.5" r="1.4" fill="currentColor" stroke="none"/></svg>
            Касса
          </a>
          <a href="/tannarx" class="{% if active == 'tannarx' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.82A2 2 0 0 0 9.59 3.24L3 3v6.59a2 2 0 0 0 .59 1.41l9.59 9.59a2 2 0 0 0 2.82 0l4.59-4.59a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg>
            Себестоимость
          </a>
          <a href="/uzum-sozlamalari" class="{% if active == 'uzum' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Uzum sozlamalari
          </a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <a href="/logout" class="theme-toggle" aria-label="Chiqish" title="Chiqish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div class="page" id="page-container">
    {% block content %}{% endblock %}
  </div>

<script>
async function apiGet(url) {
  const res = await fetch(url);
  return res.json();
}
async function apiPost(url, body) {
  return apiSend("POST", url, body);
}
async function apiSend(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.xato || "Произошла ошибка");
  return data;
}
async function apiUpload(url, formData) {
  const res = await fetch(url, { method: "POST", body: formData });
  const data = await res.json();
  if (!res.ok) throw new Error(data.xato || "Произошла ошибка");
  return data;
}
function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// raqamli maydonga bosilganda mavjud qiymat belgilanadi (select),
// shunda "0" ustiga yozganda eski nol avtomatik almashadi
document.addEventListener("focus", (e) => {
  if (e.target.matches && e.target.matches('input[type="number"]')) {
    e.target.select();
  }
}, true);

(function () {
  const btn = document.getElementById("theme-toggle");

  function applyLabel() {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    const label = dark ? "Включить светлую тему" : "Включить тёмную тему";
    btn.setAttribute("aria-label", label);
    btn.title = label;
  }

  btn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("mini-erp-tema", next); } catch (e) {}
    applyLabel();
  });

  applyLabel();
})();

(function () {
  const preview = document.createElement("img");
  preview.className = "thumb-hover-preview";
  document.body.appendChild(preview);

  function pozitsiyaQoy(img) {
    const rect = img.getBoundingClientRect();
    const size = 240;
    let left = Math.max(8, rect.left - size - 12);
    let top = rect.top;
    if (top + size > window.innerHeight) top = window.innerHeight - size - 12;
    if (top < 8) top = 8;
    preview.style.left = left + "px";
    preview.style.top = top + "px";
  }

  document.addEventListener("click", (e) => {
    const img = e.target.closest("img.thumb");
    if (img) {
      const ochiqEdi = preview.style.display === "block" && preview.src === img.src;
      if (ochiqEdi) {
        preview.style.display = "none";
      } else {
        preview.src = img.src;
        preview.style.display = "block";
        pozitsiyaQoy(img);
      }
      return;
    }
    preview.style.display = "none";
  });
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
