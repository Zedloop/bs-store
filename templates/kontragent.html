{% extends "base.html" %}
{% block title %}Контрагент{% endblock %}
{% block content %}
  <a class="back-link" href="/kassa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Назад к расчётам
  </a>

  <div class="grid">

    <div class="card">
      <div class="detail-header">
        <div class="detail-title-row">
          <h2 id="kontragent-nomi">…</h2>
          <span class="hint" id="kontragent-telefon" style="display:none; margin:0;"></span>
        </div>
        <button type="button" class="icon-btn danger" id="btn-kontragent-ochirish" title="Удалить контрагента" aria-label="Удалить контрагента">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>
      <div class="balans-wrap" id="balans-wrap">
        <div class="balans-label" id="balans-label">Баланс</div>
        <div class="balans" id="balans">—</div>
      </div>
      <div class="xato" id="xato-ochirish"></div>
    </div>

    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Новая операция
      </h2>
      <form id="form-kontragent-harakat">
        <div class="field">
          <label for="h-turi">Что произошло</label>
          <select id="h-turi">
            <option value="tovar_oldim">Взял товар в долг</option>
            <option value="tolov">Оплатил (отдал деньги)</option>
            <option value="pul_oldim">Получил от него деньги</option>
            <option value="spisanie">Списание долга</option>
          </select>
        </div>
        <div class="field">
          <label for="h-summa">Сумма, $</label>
          <input type="number" id="h-summa" placeholder="0" min="0.01" step="0.01" required>
        </div>
        <div class="field field-grow">
          <label for="h-izoh">Комментарий</label>
          <input type="text" id="h-izoh" placeholder="Например: 50 шт K9">
        </div>
        <div class="field">
          <label>Фото</label>
          <label class="btn-secondary rasm-tanlash" for="h-rasm" title="Выбрать фото (или вставьте Ctrl+V)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
            <span id="h-rasm-nomi">Прикрепить</span>
          </label>
          <input type="file" id="h-rasm" accept="image/*" hidden>
        </div>
        <button type="submit">Сохранить</button>
      </form>
      <img id="h-rasm-preview" class="rasm-preview" alt="" style="display:none">
      <div class="hint" id="h-hint" style="display:block;"></div>
      <div class="xato" id="xato-harakat"></div>
    </div>

    <div class="card full">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
        История операций
      </h2>
      <table>
        <thead><tr><th>Дата</th><th>Операция</th><th>Сумма</th><th>Долг после</th><th>Комментарий</th><th></th></tr></thead>
        <tbody id="harakatlar-jadval"></tbody>
      </table>
    </div>

  </div>
{% endblock %}
{% block script %}
<style>
  .rasm-tanlash { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-size: 13px; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .rasm-tanlash svg { width: 16px; height: 16px; flex: none; }
  .rasm-tanlash.tanlangan { color: var(--success); border-color: var(--success); }
  .rasm-preview { max-height: 90px; border-radius: 8px; border: 1px solid var(--border); margin: -6px 0 10px; }
  .izoh-cell { display: flex; align-items: center; gap: 10px; }
  .izoh-rasm { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; flex: none; }
  .rasm-oyna { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 2000; cursor: zoom-out; padding: 24px; }
  .rasm-oyna img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
</style>
<div class="rasm-oyna" id="rasm-oyna" onclick="this.style.display='none'"><img id="rasm-oyna-img" alt=""></div>
<script>
const KONTRAGENT_ID = {{ kontragent_id }};
const TURLAR = {
  tovar_oldim: { nomi: "Взял товар в долг", badge: "badge-chiqim", hint: "Мой долг перед ним увеличится." },
  tolov:       { nomi: "Оплатил",           badge: "badge-kirim",  hint: "Мой долг уменьшится. Если заплатил больше долга — он будет должен мне." },
  pul_oldim:   { nomi: "Получил деньги",    badge: "badge-samovykup", hint: "Например, вернул переплату. Его долг мне уменьшится (или мой долг вырастет)." },
  spisanie:    { nomi: "Списание",          badge: "badge-spisanie", hint: "" },
};
let balans = 0;
let harakatlar = [];
const TAHRIR_MUMKIN = document.body.dataset.rol === "admin";

function som(v) { return "$" + Math.abs(v).toLocaleString("ru-RU", { maximumFractionDigits: 2 }); }

function holat(b) {
  if (b > 0.5) return { label: "Я должен ему", cls: "manfiy" };
  if (b < -0.5) return { label: "Он должен мне", cls: "musbat" };
  return { label: "Расчёт закрыт", cls: "" };
}

function turiOzgardi() {
  const t = TURLAR[document.getElementById("h-turi").value];
  const turi = document.getElementById("h-turi").value;
  let hint = t.hint;
  if (turi === "spisanie") {
    if (balans > 0.5) hint = `Списать мой долг (без оплаты). Максимум: ${som(balans)}.`;
    else if (balans < -0.5) hint = `Списать его долг передо мной (например, переплату). Максимум: ${som(balans)}.`;
    else hint = "Долга нет — списывать нечего.";
  }
  document.getElementById("h-hint").textContent = hint;
}

async function refresh() {
  const data = await apiGet(`/api/kontragentlar/${KONTRAGENT_ID}`);
  if (data.xato) { document.getElementById("kontragent-nomi").textContent = data.xato; return; }
  const k = data.kontragent;
  balans = k.balans;
  document.title = k.nomi + " — склад и касса";
  document.getElementById("kontragent-nomi").textContent = k.nomi;
  const tel = document.getElementById("kontragent-telefon");
  tel.textContent = k.telefon || "";
  tel.style.display = k.telefon ? "inline" : "none";

  const h = holat(balans);
  document.getElementById("balans-label").textContent = h.label;
  document.getElementById("balans").textContent = som(balans);
  document.getElementById("balans").className = "balans " + h.cls;
  document.getElementById("balans-wrap").className = "balans-wrap " + (h.cls === "manfiy" ? "manfiy" : "");

  harakatlar = data.harakatlar;
  // "Долг после" - har bir operatsiyadan keyingi balans (eng yangisidan orqaga hisoblaymiz)
  let keyin = balans;
  document.getElementById("harakatlar-jadval").innerHTML = data.harakatlar.map(r => {
    const t = TURLAR[r.turi];
    const qator = `<tr id="harakat-${r.id}" class="${TAHRIR_MUMKIN ? "clickable-row" : ""}" ${TAHRIR_MUMKIN ? `onclick="tahrirlash(event, ${r.id})" title="Нажмите, чтобы изменить"` : ""}>
      <td>${r.sana.slice(0,16)}</td>
      <td><span class="badge ${t.badge}">${t.nomi}</span>${r.kassa_id ? ' <span class="hint" style="display:inline;margin:0">· касса</span>' : ""}</td>
      <td>${r.belgi > 0 ? "+" : "−"}${som(r.summa)}</td>
      <td>${Math.abs(keyin) < 0.5 ? "0" : (keyin > 0 ? "Я должен " : "Мне должны ") + som(keyin)}</td>
      <td><div class="izoh-cell">${r.rasm ? `<img class="izoh-rasm" src="/kontragent-rasm/${encodeURIComponent(r.rasm)}" alt="" onclick="rasmKorsat(this.src)">` : ""}<span>${escapeHtml(r.izoh || "")}</span></div></td>
      <td><button type="button" class="icon-btn danger harakat-ochirish" title="Удалить" onclick="harakatOchir(${r.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></td>
    </tr>`;
    keyin -= r.summa * r.belgi;
    return qator;
  }).join("") || "<tr><td colspan=6 class='empty-row'>Операций пока нет</td></tr>";
  turiOzgardi();
}

function tahrirlash(e, id) {
  if (e.target.closest("button, input, select, img, label")) return;
  const r = harakatlar.find(x => x.id === id);
  const tr = document.getElementById("harakat-" + id);
  if (!r || !tr || tr.dataset.tahrir) return;
  tr.dataset.tahrir = "1";
  tr.classList.remove("clickable-row");
  const turlar = r.turi === "spisanie"
    ? `<option value="spisanie">Списание</option>`
    : ["tovar_oldim", "tolov", "pul_oldim"].map(k =>
        `<option value="${k}" ${k === r.turi ? "selected" : ""}>${TURLAR[k].nomi}</option>`).join("");
  tr.innerHTML = `
    <td>${r.sana.slice(0,16)}</td>
    <td><select id="t-turi-${id}" ${r.turi === "spisanie" ? "disabled" : ""}>${turlar}</select></td>
    <td><input type="number" id="t-summa-${id}" value="${r.summa}" min="0.01" step="0.01" style="width:120px"></td>
    <td></td>
    <td><div class="izoh-cell">
      <input type="text" id="t-izoh-${id}" value="${escapeHtml(r.izoh || "")}" style="width:100%; min-width:140px">
      <label class="icon-btn" id="t-rasm-btn-${id}" for="t-rasm-${id}" title="${r.rasm ? "Заменить фото" : "Прикрепить фото"}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
      </label>
      <input type="file" id="t-rasm-${id}" accept="image/*" hidden onchange="const l = document.getElementById('t-rasm-btn-${id}'); l.style.color = this.files[0] ? 'var(--success)' : ''; l.style.borderColor = this.files[0] ? 'var(--success)' : ''; l.title = this.files[0] ? this.files[0].name : l.title">
      ${r.rasm ? `<button type="button" class="icon-btn danger" title="Удалить фото" onclick="rasmOchir(${id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>` : ""}
    </div></td>
    <td style="white-space:nowrap">
      <button type="button" onclick="tahrirSaqlash(${id})">Сохранить</button>
      <button type="button" class="btn-secondary" onclick="refresh()">Отмена</button>
    </td>`;
  document.getElementById("t-summa-" + id).focus();
  tr.querySelectorAll("input").forEach(inp => inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter") tahrirSaqlash(id);
    if (ev.key === "Escape") refresh();
  }));
}

async function tahrirSaqlash(id) {
  try {
    await apiSend("PATCH", `/api/kontragent-harakat/${id}`, {
      turi: document.getElementById("t-turi-" + id).value,
      summa: document.getElementById("t-summa-" + id).value,
      izoh: document.getElementById("t-izoh-" + id).value.trim(),
    });
    const fayl = document.getElementById("t-rasm-" + id).files[0];
    if (fayl) await rasmYukla(id, fayl);
    await refresh();
  } catch (err) { alert(err.message); }
}

async function rasmYukla(id, fayl) {
  const fd = new FormData();
  fd.append("rasm", fayl, fayl.name || "rasm.png");
  await apiUpload(`/api/kontragent-harakat/${id}/rasm`, fd);
}

async function rasmOchir(id) {
  if (!confirm("Удалить фото?")) return;
  try { await apiSend("DELETE", `/api/kontragent-harakat/${id}/rasm`); await refresh(); }
  catch (err) { alert(err.message); }
}

function rasmKorsat(src) {
  document.getElementById("rasm-oyna-img").src = src;
  document.getElementById("rasm-oyna").style.display = "flex";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("rasm-oyna").style.display = "none"; });

// Yangi operatsiya uchun tanlangan rasm (fayldan yoki Ctrl+V bilan qo'yilgan)
let yangiRasm = null;
function yangiRasmQoy(fayl) {
  yangiRasm = fayl;
  const nomi = document.getElementById("h-rasm-nomi");
  const prev = document.getElementById("h-rasm-preview");
  nomi.textContent = fayl ? (fayl.name || "Фото") : "Прикрепить";
  nomi.parentElement.classList.toggle("tanlangan", !!fayl);
  if (fayl) { prev.src = URL.createObjectURL(fayl); prev.style.display = "block"; }
  else { prev.removeAttribute("src"); prev.style.display = "none"; document.getElementById("h-rasm").value = ""; }
}
document.getElementById("h-rasm").addEventListener("change", e => yangiRasmQoy(e.target.files[0] || null));
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (!item) return;
  const blob = item.getAsFile();
  yangiRasmQoy(new File([blob], "screenshot.png", { type: blob.type }));
  e.preventDefault();
});

async function harakatOchir(id) {
  if (!confirm("Удалить операцию? Если она была проведена через кассу, запись в кассе тоже удалится.")) return;
  try { await apiSend("DELETE", `/api/kontragent-harakat/${id}`); await refresh(); }
  catch (err) { alert(err.message); }
}

document.getElementById("h-turi").addEventListener("change", turiOzgardi);

document.getElementById("form-kontragent-harakat").addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("xato-harakat", "");
  try {
    const res = await apiPost(`/api/kontragentlar/${KONTRAGENT_ID}/harakat`, {
      turi: document.getElementById("h-turi").value,
      summa: document.getElementById("h-summa").value,
      izoh: document.getElementById("h-izoh").value.trim(),
    });
    document.getElementById("h-summa").value = "";
    document.getElementById("h-izoh").value = "";
    if (yangiRasm) {
      try { await rasmYukla(res.id, yangiRasm); }
      catch (err) { showError("xato-harakat", "Операция сохранена, но фото не загрузилось: " + err.message); }
      yangiRasmQoy(null);
    }
    await refresh();
  } catch (err) { showError("xato-harakat", err.message); }
});

document.getElementById("btn-kontragent-ochirish").addEventListener("click", async () => {
  if (!confirm("Удалить контрагента?")) return;
  showError("xato-ochirish", "");
  try { await apiSend("DELETE", `/api/kontragentlar/${KONTRAGENT_ID}`); location.href = "/kassa"; }
  catch (err) { showError("xato-ochirish", err.message); }
});

refresh();
</script>
{% endblock %}
