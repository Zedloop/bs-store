{% extends "base.html" %}
{% block title %}Расчёты{% endblock %}
{% block content %}
  <div class="grid">

    <div class="card full">
      <div class="detail-header">
        <h2 style="margin:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>
          Расчёты
        </h2>
        <button type="button" class="icon-btn" id="btn-kontragent-qoshish" title="Добавить контрагента" aria-label="Добавить контрагента">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <form id="form-kontragent" style="display:none">
        <div class="field field-grow">
          <label for="kontragent-nomi">Имя / название</label>
          <input type="text" id="kontragent-nomi" placeholder="Например: Озод" required>
        </div>
        <div class="field">
          <label for="kontragent-telefon">Телефон</label>
          <input type="text" id="kontragent-telefon" placeholder="Необязательно">
        </div>
        <button type="submit">Добавить контрагента</button>
        <button type="button" class="btn-secondary" id="btn-kontragent-bekor">Отмена</button>
      </form>
      <div class="xato" id="xato-kontragent"></div>
      <table>
        <thead><tr><th>Контрагент</th><th>Телефон</th><th>Баланс</th><th>Последняя операция</th></tr></thead>
        <tbody id="kontragentlar-jadval"></tbody>
      </table>
    </div>

  </div>
{% endblock %}
{% block script %}
<script>
function kontragentBalans(b) {
  const s = "$" + Math.abs(b).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  if (b > 0.5) return `<span class="qoldiq-kam">Я должен ${s}</span>`;
  if (b < -0.5) return `<span style="color:var(--success);font-weight:650">Мне должны ${s}</span>`;
  return `<span style="color:var(--text-muted)">Расчёт закрыт</span>`;
}

async function refreshKontragentlar() {
  const rows = await apiGet("/api/kontragentlar");
  document.getElementById("kontragentlar-jadval").innerHTML = rows.map(k =>
    `<tr class="clickable-row" onclick="location.href='/kontragent/${k.id}'"><td><b>${escapeHtml(k.nomi)}</b></td><td>${escapeHtml(k.telefon || "")}</td><td>${kontragentBalans(k.balans)}</td><td>${k.oxirgi ? k.oxirgi.slice(0,16) : "—"}</td></tr>`
  ).join("") || "<tr><td colspan=4 class='empty-row'>Контрагентов пока нет</td></tr>";
}

document.getElementById("form-kontragent").addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("xato-kontragent", "");
  try {
    const res = await apiPost("/api/kontragentlar", {
      nomi: document.getElementById("kontragent-nomi").value.trim(),
      telefon: document.getElementById("kontragent-telefon").value.trim(),
    });
    location.href = "/kontragent/" + res.id;
  } catch (err) { showError("xato-kontragent", err.message); }
});

// "+" bosilganda yangi kontragent formasi ochiladi, "Отмена"/Esc - yopiladi
function kontragentFormasi(ochiq) {
  const form = document.getElementById("form-kontragent");
  form.style.display = ochiq ? "" : "none";
  document.getElementById("btn-kontragent-qoshish").style.display = ochiq ? "none" : "";
  showError("xato-kontragent", "");
  if (ochiq) document.getElementById("kontragent-nomi").focus();
  else form.reset();
}
document.getElementById("btn-kontragent-qoshish").addEventListener("click", () => kontragentFormasi(true));
document.getElementById("btn-kontragent-bekor").addEventListener("click", () => kontragentFormasi(false));
document.getElementById("form-kontragent").addEventListener("keydown", e => { if (e.key === "Escape") kontragentFormasi(false); });

refreshKontragentlar();
</script>
{% endblock %}
