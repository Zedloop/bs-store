{% extends "base.html" %}
{% block title %}Касса{% endblock %}
{% block content %}
  <div class="grid">

    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="14.5" r="1.4" fill="currentColor" stroke="none"/></svg>
        Баланс кассы
      </h2>
      <div class="balans-wrap" id="kassa-balans-wrap">
        <div class="balans-label">Текущий баланс</div>
        <div class="balans" id="kassa-balans">—</div>
      </div>
      <table>
        <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Комментарий</th></tr></thead>
        <tbody id="kassa-jadval"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Добавить операцию по кассе
      </h2>
      <form id="form-kassa">
        <div class="field">
          <label for="kassa-turi">Тип операции</label>
          <select id="kassa-turi" required>
            <option value="kirim">Приход (+)</option>
            <option value="chiqim">Расход (−)</option>
          </select>
        </div>
        <div class="field">
          <label for="kassa-summa">Сумма, сум</label>
          <input type="number" id="kassa-summa" placeholder="0" min="1" step="0.01" required>
        </div>
        <div class="field field-grow">
          <label for="kassa-izoh">Комментарий</label>
          <input type="text" id="kassa-izoh" placeholder="Необязательно">
        </div>
        <button type="submit">Сохранить</button>
      </form>
      <div class="xato" id="xato-kassa"></div>
    </div>

    <div class="card full">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>
        Контрагенты
      </h2>
      <form id="form-kontragent">
        <div class="field field-grow">
          <label for="kontragent-nomi">Имя / название</label>
          <input type="text" id="kontragent-nomi" placeholder="Например: Озод" required>
        </div>
        <div class="field">
          <label for="kontragent-telefon">Телефон</label>
          <input type="text" id="kontragent-telefon" placeholder="Необязательно">
        </div>
        <button type="submit">Добавить контрагента</button>
      </form>
      <div class="xato" id="xato-kontragent"></div>
      <table>
        <thead><tr><th>Контрагент</th><th>Телефон</th><th>Баланс</th><th>Последняя операция</th></tr></thead>
        <tbody id="kontragentlar-jadval"></tbody>
      </table>
    </div>

  </div>
{% endblock %}
{% block script %}
<script>
async function refreshKassa() {
  const data = await apiGet("/api/kassa");
  const balansEl = document.getElementById("kassa-balans");
  const balansWrap = document.getElementById("kassa-balans-wrap");
  balansEl.textContent = data.balans.toLocaleString("ru-RU") + " сум";
  const manfiy = data.balans < 0;
  balansEl.className = "balans " + (manfiy ? "manfiy" : "musbat");
  balansWrap.className = "balans-wrap " + (manfiy ? "manfiy" : "");

  const tbody = document.getElementById("kassa-jadval");
  tbody.innerHTML = data.harakatlar.map(k =>
    `<tr><td>${k.sana.slice(0,16)}</td><td>${k.turi === 'kirim' ? '<span class="badge badge-kirim">Приход</span>' : '<span class="badge badge-chiqim">Расход</span>'}</td><td>${k.summa.toLocaleString("ru-RU")}</td><td>${escapeHtml(k.izoh || "")}</td></tr>`
  ).join("") || "<tr><td colspan=4 class='empty-row'>Операций пока нет</td></tr>";
}

document.getElementById("form-kassa").addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("xato-kassa", "");
  const turi = document.getElementById("kassa-turi").value;
  const summa = document.getElementById("kassa-summa").value;
  const izoh = document.getElementById("kassa-izoh").value.trim();
  try {
    await apiPost("/api/kassa", { turi, summa, izoh });
    document.getElementById("kassa-summa").value = "";
    document.getElementById("kassa-izoh").value = "";
    await refreshKassa();
  } catch (err) { showError("xato-kassa", err.message); }
});

function kontragentBalans(b) {
  const s = Math.abs(b).toLocaleString("ru-RU") + " сум";
  if (b > 0.5) return `<span class="qoldiq-kam">Я должен ${s}</span>`;
  if (b < -0.5) return `<span style="color:var(--success);font-weight:650">Мне должны ${s}</span>`;
  return `<span style="color:var(--text-muted)">Расчёт закрыт</span>`;
}

async function refreshKontragentlar() {
  const rows = await apiGet("/api/kontragentlar");
  document.getElementById("kontragentlar-jadval").innerHTML = rows.map(k =>
    `<tr class="clickable-row" onclick="location.href='/kontragent/${k.id}'"><td><b>${escapeHtml(k.nomi)}</b></td><td>${escapeHtml(k.telefon || "")}</td><td>${kontragentBalans(k.balans)}</td><td>${k.oxirgi ? k.oxirgi.slice(0,16) : "—"}</td></tr>`
  ).join("") || "<tr><td colspan=4 class='empty-row'>Контрагентов пока нет</td></tr>";
}

document.getElementById("form-kontragent").addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("xato-kontragent", "");
  try {
    const res = await apiPost("/api/kontragentlar", {
      nomi: document.getElementById("kontragent-nomi").value.trim(),
      telefon: document.getElementById("kontragent-telefon").value.trim(),
    });
    location.href = "/kontragent/" + res.id;
  } catch (err) { showError("xato-kontragent", err.message); }
});

refreshKassa();
refreshKontragentlar();
</script>
{% endblock %}
